# MetaHAR v2 (2026-07): univariate M15/4h vol-change forecaster.
# One model bar = short_factor input bars (M15 x 16 = 4h).
# symbols must equal [predicted_symbol] — cross-asset baskets were walk-forward
# validated as harmful (see notebooks/metahar_wf_backtest.py, summary_dummies_own.csv).
# Predictions are published to metalib/store/vol_predictions.db (volstore.py);
# other strategies read them via MetaStrategy.get_vol_prediction(symbol).

BTCUSD_M15_UNI:
  strategy_type: metahar
  symbols: ['BTCUSD']
