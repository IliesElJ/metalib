# size_position: fixed-fraction risk. 0.0025 = 0.25% of balance lost if SL hits.
# MetaMLP._resolve_position_size delegates to
# MetaStrategy._fixed_fraction_position_size, which computes lots as
#     lots = (size_position * balance) / (sl_distance * value_per_price_unit)
# with a 5-pip FX minimum SL floor and a 5x-balance notional cap.
# Falls back to size_position as raw lots on MT5 error / missing SL.
# MetaMLP is NOT in metascal.DEFAULT_STRATEGY_PARAMS -- MetaScale will not
# overwrite these values.
#
# 0.25% target chosen from trades/month analysis (~110/mo across 7 tags):
# keeps monthly loss vol near 0.5% of balance under a sqrt(N) independence
# model with a 2x safety margin for burst-correlated fills. See
# metalib/research/reports/metafvg_v2_sizing_report.pdf sec. 4.

AUDCHF_H1_MLP:
  strategy_type: metamlp
  symbols: [AUDCHF]
  timeframe: mt5.TIMEFRAME_H1
  tag: metamlp_audchf
  size_position: 0.0025
  active_hours: None
  rolling_windows: [6, 24, 120]
  thresholds: [-7.0, -5.0, -1.0, 1.0, 5.0, 7.0]
  horizons: [4, 6, 8]
  hidden_layers: [64, 32]
  max_iter: 500
  fit_lookback_days: 365
  train_ratio: 0.9
  bollinger_k: 2.0

