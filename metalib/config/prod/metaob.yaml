# --- per-symbol-tuned like the pre-existing blocks above) - the connection
# --- between the backtested numbers and what's actually live only holds if
# --- these stay unchanged; re-tune only after re-validating.
# ---
# --- size_position is risk-matched to GER40's current live $ risk/trade
